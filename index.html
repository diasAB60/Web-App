<!DOCTYPE html>
<html>
<head> 
    <script src = "https://telegram.org/js/telegram-web-app.js"> </script>

    <meta charset = "UTF-8">

    <title> Game store </title>

    <link rel = "stylesheet" href = "GameWebCSS.css">
</head>

<body> 

    <div id = "main">
        <h1 style = "display: flex; justify-content: center; color: white;">
            <i> Welcome to Game Store!  </i>
        </h1>

        <div class = "image">
            <img src = "ImageGames.png" height = "200" width = "400"> 
        </div>    

        <div class = "button"> 
            <button id = "buy" type = "button" class = "buy-btn"> 
                <b> Buy a game </b> 
            </button>
        </div>
    </div> 
    
    <form id = "form"> 
        <input type = "text" placeholder = "Name" id = "user_name">
        <input type = "text" placeholder = "Email" id = "user_email">
        <input type = "text" placeholder = "Phone number" id = "user_phone">
        <div id = "error"> </div>
        <button id = "order" type = "button" class = "order-btn"> Arrange </button>
    </form>

    <script src = "https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        let buy = document.getElementById("buy");
        let order = document.getElementById("order");

        tg.ready();

        buy.addEventListener("click", () => {

            document.getElementById("main").style.display = "none";
            let form = document.getElementById("form");
            form.style.display = "flex";
            
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                let user = tg.initDataUnsafe.user;
                let fullName = user.first_name;
                if (user.last_name) {
                    fullName += " " + user.last_name;
                }
                document.getElementById("user_name").value = fullName;
            }
        });

        order.addEventListener("click", () => {
            document.getElementById("error").inner.Text = '';
            let name = document.getElementById("user_name").value;
            let email = document.getElementById("user_email").value;
            let phone = document.getElementById("user_phone").value;

            if (name.length < 5) {
                document.getElementById("error").innerText = 'Error in name';
                return;
            }
            if (email.length < 5) {
                document.getElementById("error").innerText = 'Error in email';
                return;
            }
            if (phone.length < 5) {
                document.getElementById("error").innerText = 'Error in phone number';
                return;
            }

            let data = {
                name: name,
                email: email,
                phone: phone
            }
            tg.sendData(JSON.stringify(data));

            tg.close();
        });
    </script>
</body>
</html>
